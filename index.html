<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OSRS Crafting Arb</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%2250%25%22 x=%2250%25%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 font-size=%2280%22>📈</text></svg>">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>OSRS Crafting Arb</h1>
      <div id="meta" class="meta"></div>
      <button id="refresh">Refresh now</button>
    </header>

    <section class="panel">
      <div class="panel-cols">
        <div class="levels-side">
          <h2>Skill levels</h2>
          <div id="levels" class="level-grid"></div>
        </div>
        <div class="filters-side">
          <h2>Filters</h2>
          <div class="controls">
      <div class="search-group">
        <label title="Case-insensitive search on the product name. Multiple words = every word must match.">
          Search
          <input id="search" type="search" placeholder="e.g. potion, rune" />
        </label>
        <label class="check" title="Search also matches material names, not just the product name.">
          <input id="searchMaterials" type="checkbox" /> Search materials
        </label>
      </div>
      <div class="check-stack">
        <label class="check">
          <input id="filterLevels" type="checkbox" /> Filter by my levels
        </label>
        <label class="check">
          <input id="f2pOnly" type="checkbox" /> F2P only
        </label>
        <label class="check" title="Only show recipes whose best route (Sell Net, HA Net or LA Net) is positive per craft.">
          <input id="profitableOnly" type="checkbox" /> Profitable only
        </label>
      </div>
      <label title="Filter by the better (cheaper) way to get the product: craft it (Craft < Buy x qty) or buy qty units on the GE (Buy x qty < Craft). Select one or both; empty selection = no filter. Recipes with no buy price are excluded when a side is selected.">Better option
        <select id="acqFilter" multiple size="2">
          <option value="craft">craft</option>
          <option value="buy">buy</option>
        </select>
      </label>
      <label title="Show/hide route columns: GE = Sell + Sell Net, HA = High Alchemy + HA Net, LA = Low Alchemy + LA Net. Best Net only considers enabled routes; empty selection hides all three.">Routes
        <select id="routeFilter" multiple size="3">
          <option value="ge">GE</option>
          <option value="ha">HA</option>
          <option value="la">LA</option>
        </select>
      </label>
          </div>
        </div>
      </div>
    </section>

    <div id="errorBanner" class="error banner" hidden></div>

    <table class="recipe-table">
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <script src="profit.js"></script>
  <script src="pricestore.js"></script>
  <script src="app.js"></script>
</body>
</html>
